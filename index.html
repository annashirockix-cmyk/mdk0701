<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Учебный портал МДК</title>
<link rel="stylesheet" href="style.css?v=200">
<script>
  (function(){ try { document.documentElement.setAttribute("data-theme", localStorage.getItem("mdk.theme") || "light"); } catch(e) {} })();
</script>
</head>
<body>

<div class="login-overlay" id="loginOverlay" hidden>
  <div class="login-card">
    <div style="text-align: center; margin-bottom: 25px;">
        <span class="brand-badge" style="font-size: 16px; padding: 8px 16px;">ПОРТАЛ МДК</span>
    </div>
    <form onsubmit="event.preventDefault(); window.doStudentLogin();">
      <h3>🎓 Вход студента</h3>
      <input id="loginName" type="text" placeholder="ФИО" required>
      <input id="loginGroup" type="text" placeholder="Группа" required>
      <button type="submit" class="btn" style="width:100%; margin-top:15px;">Войти</button>
    </form>
  </div>
</div>

<header class="topbar">
  <button class="burger-btn" id="burgerBtn"><span></span><span></span><span></span></button>
  
  <div style="display:flex; gap:5px; margin-right:10px;">
      <button class="btn ghost" onclick="history.back()" style="padding:6px 10px;">←</button>
      <button class="btn ghost" onclick="history.forward()" style="padding:6px 10px;">→</button>
  </div>

  <a class="brand" href="#/"><span class="brand-badge">МДК 07.01</span></a>
  <div class="crumbs" id="crumbs" style="margin-left:auto;"></div>
  <div class="topbar-status"><span class="status-pill" id="xpCount">🌟 0 XP</span></div>
  <button id="themeToggle" class="btn ghost" style="padding: 8px 12px; margin-left: 5px;">🎨</button>
</header>

<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-user">
      <span id="userChipAvatar" style="font-size:24px;">👨‍🎓</span>
      <div style="margin-left:10px;"><div id="userChipName">Гость</div><div id="userChipGroup" style="font-size:12px;color:var(--muted)">Группа</div></div>
    </div>
    <button class="drawer-close" id="drawerClose">✕</button>
  </div>
  <nav class="drawer-nav" style="flex:1; overflow-y:auto; padding: 10px 0;">
    <a class="drawer-item" data-go="#/">🏠 Главная</a>
    <a class="drawer-item" data-go="#/profile">👤 Личный кабинет</a>
    
    <div style="padding: 15px 20px 5px; font-size: 10px; color: var(--muted); font-weight: bold;">Материалы</div>
    <a class="drawer-item" data-go="#/videos">🎬 Видео</a>
    <a class="drawer-item" data-go="#/passports">📄 Паспорта</a>
    <a class="drawer-item" data-go="#/safety">🦺 Охрана труда</a>
    <a class="drawer-item" data-go="#/formatting">📝 Оформление</a>

    <a class="drawer-item" style="color:var(--err); cursor:pointer; margin-top:20px;" onclick="window.handleLogout()">🚪 Выйти</a>
  </nav>
</aside>

<main id="app" style="padding: 32px 24px 100px; max-width: 1100px; margin: 0 auto;"></main>

<div style="position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--border); display:flex; justify-content:space-around; padding:10px; z-index:900;">
    <button class="btn ghost" onclick="history.back()" style="flex:1; margin:0 5px;">← Назад</button>
    <button class="btn" onclick="location.hash='#/'" style="flex:1; margin:0 5px;">🏠 Главная</button>
    <button class="btn ghost" onclick="history.forward()" style="flex:1; margin:0 5px;">Вперед →</button>
</div>

<script src="data.js?v=200"></script>
<script src="api.js?v=200"></script>
<script src="logic.js?v=200"></script>
<script src="ui.js?v=200"></script>
</body>
</html>

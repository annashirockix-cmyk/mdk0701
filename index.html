<!-- Применяем тему ДО отрисовки, чтобы не было вспышки светлым -->
<script>
  (function(){
    try {
      var t = localStorage.getItem("mdk0701.theme");
      if (!t || t === "auto"){
        var d = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        t = d ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    } catch(e){}
  })();
</script>

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div class="login-overlay" id="loginOverlay" hidden>
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-badge">МДК 07.01</span>
      <h1>Вход в систему</h1>
    </div>
    <p class="login-sub">Введите свои данные, чтобы начать работу. Прогресс сохранится в браузере и в облаке.</p>

    <label for="loginName">ФИО студента</label>
    <input id="loginName" type="text" placeholder="Иванов Иван Иванович" autocomplete="name">
    <div class="field-hint" id="nameHint"></div>

    <label for="loginGroup">Группа</label>
    <input id="loginGroup" type="text" placeholder="ТМ-21" autocomplete="off" list="groupList">
    <datalist id="groupList">
      <option value="ТМ-21"><option value="ТМ-22"><option value="ТМ-23">
      <option value="ТС-21"><option value="ТС-22"><option value="ТМ-20">
    </datalist>
    <div class="field-hint" id="groupHint"></div>

    <label>Аватар</label>
    <div class="avatar-picker-inline" id="loginAvatarPicker"></div>

    <button id="loginBtn" class="btn login-btn">Войти</button>
    <p class="login-hint">Если вы уже заходили с другого устройства — введите те же ФИО и группу.</p>
  </div>
</div>

<!-- ШАПКА -->
<header class="topbar">
  <div class="nav-group">
    <button class="nav-btn" id="navBack" title="Назад" aria-label="Назад">←</button>
    <button class="nav-btn" id="navForward" title="Вперёд" aria-label="Вперёд">→</button>
    <a class="brand" href="#/" onclick="goHome(event)">
      <span class="brand-badge">МДК 07.01</span>
      <span class="brand-title">Оператор станков с ПУ</span>
    </a>
  </div>

  <div class="crumbs" id="crumbs"></div>

  <div class="topbar-status">
    <span class="status-pill" id="onlineCount" title="Сейчас онлайн">🌐 —</span>
    <span class="status-pill" id="netStatus" title="Соединение">📶</span>
  </div>

  <div class="user-chip" id="userChip" title="Меню профиля" hidden>
    <span class="user-chip-avatar" id="userChipAvatar">👨‍🎓</span>
    <span class="user-chip-info">
      <span class="user-chip-name" id="userChipName"></span>
      <span class="user-chip-group" id="userChipGroup"></span>
    </span>
  </div>

  <button class="topbar-btn" id="searchBtn" title="Поиск (Ctrl+K)" aria-label="Поиск">🔍</button>
  <button class="topbar-btn" id="chatBtn" title="Чат группы" aria-label="Чат">💭</button>
  <button class="topbar-btn" id="questionsBtn" title="Вопросы преподавателю" aria-label="Вопросы">❓</button>
  <button class="topbar-btn" id="dashboardBtn" title="Статистика" aria-label="Статистика">📊</button>
  <button class="topbar-btn" id="moreBtn" title="Ещё" aria-label="Ещё">⋯</button>
  <button class="theme-toggle" id="themeToggle" title="Сменить тему" aria-label="Сменить тему">
    <span class="theme-icon" id="themeIcon">🎨</span>
  </button>
</header>

<!-- БАННЕР ОБЪЯВЛЕНИЙ -->
<div class="announce-bar" id="announceBar" hidden>
  <span class="announce-icon">📣</span>
  <span class="announce-text" id="announceText"></span>
  <button class="announce-close" id="announceClose" aria-label="Закрыть">✕</button>
</div>

<main id="app"></main>

<footer class="footer">
  ГБПОУ МО «Луховицкий авиационный техникум» · Профессионалитет · 2024
</footer>

<canvas id="confettiCanvas" class="confetti-canvas"></canvas>

<script src="data.js"></script>
<script src="info.js"></script>
<script src="script.js"></script>
<script src="extra.js"></script>
</body>
</html>

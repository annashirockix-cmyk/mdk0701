<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>МДК 07.01</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;900&family=Orbitron:wght@400;600;900&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=170">

<script>
  (function(){
    try {
      var t = localStorage.getItem("mdk0701.theme") || "light";
      document.documentElement.setAttribute("data-theme", t);
    } catch(e) {}
  })();
</script>
</head>
<body>

<!-- ЛОГИН -->
<div class="login-overlay" id="loginOverlay" hidden>
  <div class="login-card" style="border: 2px solid var(--accent); box-shadow: 0 0 30px rgba(193, 74, 42, 0.3);">
    <div style="text-align: center; margin-bottom: 25px;">
        <span class="brand-badge" style="font-size: 16px; padding: 8px 16px; letter-spacing: 2px;">МДК 07.01</span>
    </div>
    <form onsubmit="event.preventDefault(); window.doStudentLogin();">
      <h3>🎓 Вход студента</h3>
      <input id="loginName" type="text" placeholder="ФИО" required style="border-radius: 0; border: none; border-bottom: 2px solid var(--border);">
      <input id="loginGroup" type="text" placeholder="Группа" required style="border-radius: 0; border: none; border-bottom: 2px solid var(--border);">
      <button type="submit" class="btn" style="width:100%; border-radius: 0; margin-top: 15px;">Войти в систему</button>
    </form>
    <div style="text-align:center; margin:20px 0; color:var(--muted); font-size:12px; font-weight:bold; letter-spacing: 2px;">─── ИЛИ ───</div>
    <form onsubmit="event.preventDefault(); window.doTeacherLogin();">
      <h3>👨‍🏫 Вход сотрудника</h3>
      <input id="loginStaffName" type="text" placeholder="Логин" required style="border-radius: 0; border: none; border-bottom: 2px solid var(--border);">
      <input id="loginStaffPass" type="password" placeholder="Пароль" required style="border-radius: 0; border: none; border-bottom: 2px solid var(--border);">
      <button id="staffLoginBtn" type="submit" class="btn ghost" style="width:100%; border-radius: 0; margin-top: 15px;">Войти</button>
    </form>
  </div>
</div>

<!-- ТОПБАР -->
<header class="topbar">
  <button class="burger-btn" id="burgerBtn"><span></span><span></span><span></span></button>
  <a class="brand" href="#/"><span class="brand-badge">МДК 07.01</span></a>
  
  <div class="search-container" style="flex:1; margin: 0 10px; max-width: 300px; position:relative;">
    <input type="text" id="globalSearch" class="self-input" placeholder="Поиск..." style="margin:0; padding:8px 12px; width:100%; border-radius:20px; font-size:13px;">
    <div id="searchResults" style="display:none; position:absolute; top:100%; left:0; right:0; background:var(--card); border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow); z-index:100; max-height:250px; overflow-y:auto; margin-top:5px;"></div>
  </div>

  <div class="crumbs" id="crumbs" style="margin-left:auto;"></div>
  <a href="#/notifications" class="notif-bell" id="notifBell" style="position:relative; margin-right:15px; text-decoration:none; font-size:20px;">🔔<span id="notifBadge" style="position:absolute; top:-5px; right:-8px; background:var(--err); color:#fff; font-size:10px; border-radius:50%; padding:2px 5px; display:none;">0</span></a>
  <div class="topbar-status"><span class="status-pill" id="xpCount">🌟 0 XP</span></div>
  <button id="fontSizeToggle" class="btn ghost" style="padding: 8px 12px; margin-left: 5px; border-radius: 4px; font-weight:bold;">A+</button>
  <button id="themeToggle" class="btn ghost" style="padding: 8px 12px; margin-left: 5px; border-radius: 4px;">🎨</button>
</header>

<!-- DRAWER -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer" style="display:flex; flex-direction:column;">
  <div class="drawer-head">
    <div class="drawer-user">
      <span id="userChipAvatar" style="font-size:24px;">👨‍🎓</span>
      <div><div id="userChipName">Гость</div><div id="userChipGroup" style="font-size:12px;color:var(--muted)">Роль: Гость</div></div>
    </div>
    <button class="drawer-close" id="drawerClose">✕</button>
  </div>
  <nav class="drawer-nav" style="flex:1; overflow-y:auto; padding: 10px 0;">
    <a class="drawer-item" data-go="#/">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Главная</span>
    </a>
    <a class="drawer-item" data-go="#/profile">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Личный кабинет</span>
    </a>
    <a class="drawer-item" data-go="#/shop">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span>Магазин XP</span>
    </a>
    <a class="drawer-item" data-go="#/journal">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Журнал</span>
    </a>
    <a class="drawer-item" data-go="#/requests" id="navRequests" style="display:none; color:var(--accent); font-weight:bold;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      <span>Заявки</span>
    </a>

    <div style="padding: 15px 20px 5px; font-size: 10px; color: var(--muted); text-transform: uppercase; font-weight: bold; letter-spacing: 1px;">🎮 Игровой сектор</div>
    <a class="drawer-item" data-go="#/arcade">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 12h4"/><path d="M8 10v4"/><circle cx="16" cy="10" r="1"/><circle cx="18" cy="12" r="1"/></svg>
      <span>Игровая комната</span>
    </a>
    <a class="drawer-item" data-go="#/gcode-test">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span>Тест G-кода</span>
    </a>
    <a class="drawer-item" data-go="#/rating">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      <span>Доска почета</span>
    </a>
    
    <a class="drawer-item" style="color:var(--err); cursor:pointer; margin-top:20px;" onclick="window.handleLogout()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span>Выйти из системы</span>
    </a>
  </nav>
</aside>

<main id="app"></main>
<footer class="footer">ГБПОУ МО «Луховицкий авиационный технический техникум» · v170</footer>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function() { navigator.serviceWorker.register("sw.js").catch(console.warn); });
  }
</script>
</body>
</html>

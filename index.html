<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Учебный портал</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css?v=183">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
  (function(){
    try {
      var t = localStorage.getItem("mdk.theme") || "light";
      document.documentElement.setAttribute("data-theme", t);
    } catch(e) {}
  })();
</script>
</head>
<body>

<div class="login-overlay" id="loginOverlay" hidden>
  <div class="login-card">
    <div style="text-align: center; margin-bottom: 25px;">
        <span class="brand-badge" style="font-size: 16px; padding: 8px 16px;">Учебный портал</span>
    </div>
    <form onsubmit="event.preventDefault(); window.doStudentLogin();">
      <h3>🎓 Вход студента</h3>
      <input id="loginName" type="text" placeholder="ФИО" required>
      <input id="loginGroup" type="text" placeholder="Группа" required>
      <button type="submit" class="btn" style="width:100%;">Войти</button>
    </form>
  </div>
</div>

<header class="topbar">
  <button class="burger-btn" id="burgerBtn"><span></span><span></span><span></span></button>
  
  <!-- ВЫБОР ПРЕДМЕТА -->
  <select id="courseSelect" onchange="window.switchCourse(this.value)" style="padding:8px; border-radius:8px; font-weight:bold; background:var(--card-soft); color:var(--text); border:1px solid var(--accent); outline:none;">
    <option value="07.01">МДК 07.01 (ЧПУ)</option>
    <option value="04.01">МДК 04.01 (Диагностика)</option>
  </select>

  <div class="crumbs" id="crumbs" style="margin-left:auto; display:none;"></div>
  <div class="topbar-status"><span class="status-pill" id="xpCount">🌟 0 XP</span></div>
  <button id="themeToggle" class="btn ghost" style="padding: 8px 12px; margin-left: 5px;">🎨</button>
</header>

<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-user">
      <span id="userChipAvatar" style="font-size:24px;">👨‍🎓</span>
      <div style="margin-left:10px;"><div id="userChipName">Гость</div><div id="userChipGroup" style="font-size:12px;color:var(--muted)">Роль: Гость</div></div>
    </div>
    <button class="drawer-close" id="drawerClose">✕</button>
  </div>
  <nav class="drawer-nav" style="flex:1; overflow-y:auto; padding: 10px 0;">
    
    <div style="padding: 15px 20px 5px; font-size: 10px; color: var(--muted); text-transform: uppercase; font-weight: bold;">Обучение</div>
    <a class="drawer-item" data-go="#/">🏠 Главная</a>
    <a class="drawer-item" data-go="#/profile">👤 Личный кабинет</a>
    <a class="drawer-item" data-go="#/portfolio">📄 Резюме</a>
    <a class="drawer-item" data-go="#/final">📝 Итоговый экзамен (10 мин)</a>

    <div style="padding: 15px 20px 5px; font-size: 10px; color: var(--muted); text-transform: uppercase; font-weight: bold;">Материалы</div>
    <a class="drawer-item" data-go="#/schedule">📅 Расписание</a>
    <a class="drawer-item" data-go="#/videos">🎬 Видео</a>

    <div style="padding: 15px 20px 5px; font-size: 10px; color: var(--muted); text-transform: uppercase; font-weight: bold;">Игровой сектор</div>
    <a class="drawer-item" data-go="#/arcade">🕹️ Игровая комната</a>
    <a class="drawer-item" data-go="#/gcode-test">🛠️ Симулятор</a>

    <div style="padding: 15px 20px 5px; font-size: 10px; color: #ffd700; text-transform: uppercase; font-weight: bold;">VIP Сектор</div>
    <a class="drawer-item" data-go="#/subscription" style="color: #ffd700; font-weight: bold;">👑 VIP Подписка</a>
    <a class="drawer-item" data-go="#/vip-cheats" id="navVipCheats" style="display:none; color:var(--err);">🕵️ Чит-лист</a>
    <a class="drawer-item" data-go="#/vip-materials" id="navVipMat" style="display:none; color:var(--ok);">📚 База знаний</a>

    <a class="drawer-item" style="color:var(--err); cursor:pointer; margin-top:20px;" onclick="window.handleLogout()">🚪 Выйти</a>
  </nav>
</aside>

<main id="app" style="padding: 32px 24px 80px; max-width: 1100px; margin: 0 auto;"></main>

<!-- СКРИПТЫ -->
<script src="data.js?v=183"></script>
<script src="logic.js?v=183"></script>
<script src="ui.js?v=183"></script>
<script src="minigames.js?v=183"></script>
<script src="final.js?v=183"></script>

<script>
  // Установка выбранного курса в селект
  document.addEventListener("DOMContentLoaded", () => {
      if(document.getElementById("courseSelect")) {
          document.getElementById("courseSelect").value = localStorage.getItem("mdk.courseId") || "07.01";
      }
  });
</script>
</body>
</html>

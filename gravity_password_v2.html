HOW TO USE

1. Open this file in a browser and type any password. Every letter turns into a
   small amber bead that drops onto the line and glows. Press Sign in with a wrong
   password: the beads go dark, fall, bounce off the bottom edge and roll into
   the low corner. Type again and press Sign in with the right one: the pile lights
   up, every bead lifts off, they settle into one even row, light runs along it
   and the button turns gold. The right password for this demo is sunshine!

2. Numbers to change, top of the script:
   GRAVITY   how fast the beads fall, px per frame squared
   BOUNCE    how much speed a bead keeps when it hits the bottom,
             0 lands dead, 0.8 is a rubber ball
   TILT      degrees the field sinks with every wrong try, 0 keeps it level
   STIFF     how hard the right password pulls the beads into their row,
             0.03 drifts up slowly, 0.1 snaps
   DAMP      how much speed a rising bead keeps each frame,
             0.7 settles without a wobble, 0.9 sways before it stops
   --bead    in the CSS of .gp, the size of one bead
   --gold    in the CSS of .gp, the colour of the light

3. Connect your server in checkPassword() and return true when the password is
   right. The beads are drawn over a real password input, so Enter, autofill and
   password managers keep working. After a right password, typing again clears
   the row and starts over.

4. Copy into your site: the styles from ".gp" down (not body), the block marked
   EFFECT, and the script before </body>. No libraries, no canvas.

5. With reduced motion turned on, nothing falls or flies: the beads fade out on
   a wrong password and the row fades in on the right one.

  const BOUNCE = 0.42;
  const TILT = 1.6;
  const STIFF = 0.06;
  const DAMP = 0.78;
  const DEMO_PASSWORD = 'sunshine!';

  async function checkPassword(password) {
    // ask your server here and return true when the password is right
    return password === DEMO_PASSWORD;
  }

  const form = document.querySelector('.gp');
  const field = form.querySelector('.field'), input = field.querySelector('input');
  const layer = field.querySelector('.beads'), caret = layer.querySelector('.caret');
  const msg = form.querySelector('.msg'), button = form.querySelector('button');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const STEP = 1 / 60, PAD = 20, GAP = 8, NAP = 20, GRIP = .9, ROLL = .985;

  let typed = [], fallen = [], rising = [], seed = 7, blink, checking = false, signedIn = false;
  let tries = 0, warned = false;
  let R = 7, FLOOR = 0, LEFT = 0, RIGHT = 0, MID = 0;
  const tilt = { angle: 0, velocity: 0, goal: 0 };
  const rand = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const put = (el, x, y) => { el.style.translate = `${x - R}px ${y - R}px`; };
  const vibrate = p => { if (navigator.vibrate) navigator.vibrate(p); };

  function measure() {
    R = parseFloat(getComputedStyle(form).getPropertyValue('--bead')) / 2;
    FLOOR = layer.clientHeight - R - 3; // the bottom edge of the field
    MID = layer.clientHeight / 2;
    LEFT = R + 4;
    RIGHT = layer.clientWidth - R - 4;

  // where the i-th of n beads sits on the line: evenly spaced, closer together when there are many
  function slot(i, n) {
    const step = Math.min(R * 2 + GAP, (layer.clientWidth - PAD * 2 - R * 2) / Math.max(n - 1, 1));
    return PAD + R + i * step;
  }

  function layout() {
    measure();
    typed.forEach((b, i) => { b.x = slot(i, typed.length); b.y = MID; put(b.el, b.x, b.y); });
    const at = Math.min(input.selectionStart ?? typed.length, typed.length);
    caret.style.transform = `translateX(${(typed.length ? slot(at - 1, typed.length) + R + GAP / 2 : PAD) - 1}px)`;
  }

  function wake() {
    blink?.cancel();
    blink = caret.animate(
      [{ opacity: 1 }, { opacity: 1, offset: .5 }, { opacity: 0, offset: .5 }, { opacity: 0 }],
      { duration: 1000, iterations: Infinity });
  }

  function bead() {
    const el = document.createElement('i');
    el.className = 'bead';
    layer.insertBefore(el, caret);
    return { el, x: 0, y: 0, vx: 0, vy: 0 };
  }

  function sync() {
    if (signedIn) restart();
    while (typed.length < input.value.length) {
      const b = bead();
      typed.push(b);
      // every new bead drops onto the line and settles with one small bounce
      if (!reduce) b.el.animate([
        { transform: 'translateY(-16px)', opacity: 0 },
        { transform: 'translateY(0)', opacity: 1, offset: .62 },
        { transform: 'translateY(-3px)', offset: .82 },
        { transform: 'translateY(0)' },
      ], { duration: 260, easing: 'cubic-bezier(.23, 1, .32, 1)' });
    }
    while (typed.length > input.value.length) {
      const { el } = typed.pop();
      el.animate([{ scale: 1, opacity: 1 }, { scale: .6, opacity: 0 }], { duration: 120, easing: 'ease-out', fill: 'forwards' }).onfinish = () => el.remove();
    }
    layout();
    wake();
  }

  // wrong password: the light goes out of the beads and they fall onto the pile from the tries before
  function collapse() {
    tries++;
    warned = true;
    field.classList.add('error');
    setTimeout(() => field.classList.remove('error'), 240);
    msg.textContent = tries > 1 ? `Wrong password ×${tries}` : 'Wrong password';
    msg.animate([{ opacity: 0, translate: '0 -4px' }, { opacity: 1, translate: '0 0' }], { duration: 200, easing: 'ease-out', fill: 'forwards' });
    vibrate([18, 40, 18]);
    measure();
    tilt.goal = -TILT * Math.min(tries, 3) * Math.PI / 180;
    typed.forEach((b, i) => {
      b.el.style.setProperty('--light-delay', `${i * 18}ms`);
      b.el.classList.add('dark');
      const hop = -2.5 - rand() * 2.5;
      const flight = (-hop + Math.sqrt(hop * hop + 2 * GRAVITY * (FLOOR - b.y))) / GRAVITY;
      const aim = LEFT + rand() * R * 7;
      Object.assign(b, { floor: FLOOR, wait: i * .025, rest: 0, from: { x: b.x, y: b.y }, vx: (aim - b.x) / flight, vy: hop });

    typed = [];
    input.value = '';
    layout();
    input.focus();
    if (reduce) { fallen.forEach(b => b.el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'forwards' }).onfinish = () => b.el.remove()); fallen = []; return; }

  function welcome() {
    signedIn = true;
    tries = 0;
    hush();
    measure();
    const all = [...fallen, ...typed].sort((a, b) => a.x - b.x);
    const fits = Math.floor((layer.clientWidth - PAD * 2) / (R * 1.15)) || 1;
    all.splice(fits).forEach(b => b.el.animate([{ opacity: 1 }, { opacity: 0, scale: .6 }], { duration: 240, fill: 'forwards' }).onfinish = () => b.el.remove());
    all.forEach((b, i) => {
      b.el.style.setProperty('--light-delay', `${i * 32}ms`);
      b.el.style.setProperty('--breathe-delay', `${i * 90}ms`);
      b.el.classList.remove('dark');
      b.goal = { x: slot(i, all.length), y: MID };
      b.wait = .12 + i * .035;
      b.vy = -(2 + rand() * 1.5); // a small push upwards first, so the lift reads before the beads find their place
      b.vx = 0;
    });

    caret.style.visibility = 'hidden';
    fallen = [];
    typed = [];
    tilt.goal = 0;
    vibrate(24);
    if (reduce) { rising.forEach(b => { b.x = b.goal.x; b.y = b.goal.y; put(b.el, b.x, b.y); }); arrive(); return; }
    run();
  }

  // the row is in place: light runs along it and the button turns gold
  function arrive() {
    field.classList.add('ok');
    form.classList.add('ok');
  }

  // typing after a right password clears the row and starts over
  function restart() {
    signedIn = false;
    caret.style.visibility = '';
    field.classList.remove('ok');
    form.classList.remove('ok');
    rising.forEach((b, i) => b.el.animate([{ opacity: 1, scale: 1 }, { opacity: 0, scale: .6 }], { duration: 160, delay: (rising.length - i) * 14, easing: 'ease-out', fill: 'forwards' }).onfinish = () => b.el.remove());

      for (let j = i + 1; j < fallen.length; j++) {
        const a = fallen[i], b = fallen[j];
        if (a.wait > 0 || b.wait > 0) continue;
        const ma = a.rest > NAP ? 0 : 1, mb = b.rest > NAP ? 0 : 1; // a bead at rest stays where it is

    const k = (2 * Math.PI / .5) ** 2, c = 4 * Math.PI * .4 / .5;

    tilt.angle += tilt.velocity * STEP;
    const lean = Math.sin(tilt.angle);

    const loose = [];
    for (const b of fallen) {
      if (b.wait > 0) { b.wait -= STEP; continue; }
      if (b.rest > NAP) continue;
      loose.push(b);
      b.touched = false;
      b.vx += GRAVITY * lean;
      b.vy += GRAVITY;

      if (b.touched) { b.vx *= GRIP; b.vy *= GRIP; }
      b.x += b.vx;
      b.y += b.vy;
      if (b.y > b.floor) {
        b.y = b.floor;
        b.vy *= -BOUNCE;
      }
      if (b.y === b.floor && Math.abs(b.vy) < GRAVITY) { b.vy = 0; b.vx *= ROLL; }

      else if (++b.rest > NAP) b.vx = b.vy = 0;
    }

    let moving = false;
    for (const b of rising) {
      if (b.wait > 0) { b.wait -= STEP; moving = true; continue; }
      b.vx += (b.goal.x - b.x) * STIFF;
      b.vy += (b.goal.y - b.y) * STIFF;
      b.vx *= DAMP; b.vy *= DAMP;
      b.x += b.vx;
      b.y += b.vy;
      if (Math.abs(b.goal.x - b.x) + Math.abs(b.goal.y - b.y) > .2 || Math.abs(b.vx) + Math.abs(b.vy) > .05) moving = true;
      else { b.x = b.goal.x; b.y = b.goal.y; }
    }
    if (rising.length && !moving && !field.classList.contains('ok')) arrive();

    return moving || fallen.some(b => b.wait > 0 || b.rest <= NAP) || Math.abs(tilt.angle - tilt.goal) > 1e-4 || Math.abs(tilt.velocity) > 1e-3;
  }

  function draw() {
    for (const b of fallen) put(b.el, b.x, b.y);
    for (const b of rising) put(b.el, b.x, b.y);
    field.style.transform = tilt.angle ? `rotate(${tilt.angle}rad)` : '';
  }

  let running = false, last = 0, acc = 0, calm = 0;
  function frame(now) {
    acc += Math.min((now - last) / 1000, .1);
    last = now;
    while (acc >= STEP) {
      acc -= STEP;
      calm = step() ? 0 : calm + 1;
    }
    if (calm > 30) {
      tilt.angle = tilt.goal;
      tilt.velocity = 0;
      running = false;
    }
    draw();
    if (running) requestAnimationFrame(frame);
  }
  function run() {
    calm = 0;
    if (running) return;
    running = true;
    requestAnimationFrame(t => { last = t; acc = 0; requestAnimationFrame(frame); });
  }

  function hush() {
    if (!warned) return;
    warned = false;
    msg.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 150, easing: 'ease-out', fill: 'forwards' })
      .onfinish = () => { if (!warned) msg.textContent = ''; };
  }

  input.addEventListener('input', () => { hush(); sync(); });
  input.addEventListener('keyup', layout);
  input.addEventListener('focus', () => { field.classList.add('focus'); layout(); wake(); });
  input.addEventListener('blur', () => field.classList.remove('focus'));
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!input.value || checking || signedIn) { input.focus(); return; }
    checking = true;
    const ok = await checkPassword(input.value);
    checking = false;
    if (ok) welcome(); else collapse();
  });
  addEventListener('resize', layout);
})();
</script>
</body>
</html>

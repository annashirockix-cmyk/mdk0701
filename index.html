<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МДК 07.01</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="style.css?v=30">
</head>
<body>

<!-- ОКНО ВХОДА -->
<div class="login-overlay" id="loginOverlay" hidden>
  <div class="login-card" style="max-width: 400px; background: var(--card); padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
    
    <div class="login-brand" style="text-align: center; margin-bottom: 25px;">
      <span class="brand-badge" style="font-size: 14px; padding: 6px 12px; background:var(--accent); color:#fff;">МДК 07.01</span>
    </div>

    <!-- СТУДЕНТ -->
    <h3 style="margin-top:0; margin-bottom:15px; font-size:18px;">🎓 Вход студента</h3>
    <input id="loginName" type="text" placeholder="ФИО (Иванов Иван)" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text);">
    <input id="loginGroup" type="text" placeholder="Группа (ТМ-21)" style="width:100%; padding:12px; margin-bottom:15px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text);">
    <button class="btn" style="width:100%; padding:12px;" onclick="window.doStudentLogin(event)">Войти как студент</button>

    <div style="text-align:center; margin:20px 0; color:var(--muted); font-size:13px; font-weight:bold;">─── или ───</div>

    <!-- УЧИТЕЛЬ -->
    <h3 style="margin-top:0; margin-bottom:15px; font-size:18px;">👨‍🏫 Вход сотрудника</h3>
    <input id="loginStaffName" type="text" placeholder="Логин (admin / teacher)" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text);">
    <input id="loginStaffPass" type="password" placeholder="Пароль" style="width:100%; padding:12px; margin-bottom:15px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text);">
    <button id="staffLoginBtn" class="btn ghost" style="width:100%; padding:12px; border-color:var(--accent); color:var(--accent);" onclick="window.doTeacherLogin(event)">Войти как сотрудник</button>

  </div>
</div>

<header class="topbar">
  <button class="burger-btn" id="burgerBtn"><span></span><span></span><span></span></button>
  <a class="brand" href="#/"><span class="brand-badge">МДК 07.01</span></a>
  <div class="crumbs" id="crumbs"></div>
  <div class="topbar-status"><span class="status-pill" id="xpCount">🌟 0 XP</span></div>
</header>

<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-user"><span id="userChipAvatar" style="font-size:24px;">👨‍🎓</span><div><div id="userChipName">Гость</div><div id="userChipGroup" style="font-size:12px;color:var(--muted)">Роль: Гость</div></div></div>
    <button class="drawer-close" id="drawerClose">✕</button>
  </div>
  <nav class="drawer-nav">
    <a class="drawer-item" data-go="#/">🏠 <span>Главная</span></a>
    <a class="drawer-item" data-go="#/profile">👤 <span>Личный кабинет</span></a>
    <a class="drawer-item" data-go="#/simulator">🖥️ <span>Симулятор G-кода</span></a>
    <a class="drawer-item" data-go="#/shop">🛒 <span>Магазин XP</span></a>
    <a class="drawer-item" data-go="#/portfolio">🎓 <span>Портфолио</span></a>
    <a class="drawer-item" data-go="#/dashboard">📊 <span>Статистика</span></a>
    <a class="drawer-item" data-go="#/journal">📔 <span>Журнал</span></a>
    <a class="drawer-item" data-go="#/rating">🏆 <span>Рейтинг</span></a>
  </nav>
</aside>

<main id="app"></main>
<footer class="footer">ГБПОУ МО «Луховицкий авиационный технический техникум» · v30.0</footer>

<script src="assistant.js?v=30"></script>
</body>
</html>

  Pixel Dragon by @codinvisual · t.me/CodinVisual

  HOW TO USE
  Try it: double-click this file, it opens in your browser. A black pixel dragon beats its wings in place and leaves a smear behind them.
  No JavaScript. The dragon is a tiny sprite sheet, eleven frames of one wingbeat in a single strip,
  the first one twice, so the wings hang for a moment at the top before they strike down.
  image-rendering: pixelated keeps every pixel sharp when it is scaled up, steps(11) jumps from frame to frame,
  a faint grid mask and a half-pixel blur soften it, the way an old screen shows pixels.
  Put it on your site:
  1. Copy everything inside <style> except the `body { ... }` rule into your CSS.
  2. Copy the <div class="dragon"></div> into your page where the dragon should fly.
  Worth changing:
  .8s in the animation line is one wingbeat. .5s is frantic, 1.4s slow and heavy.
  --cell: 4px is the size of one pixel. 2px makes a small dragon, 6px a big one, the rest follows by itself.
  With reduced motion turned on, the dragon holds still on the first frame.

<title>Pixel Dragon</title>
<style>
  /* Pixel Dragon by @codinvisual · t.me/CodinVisual · free for your own site, don't resell this file */
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #a3a3a3; }

  .dragon {
    --cell: 4px; --w: calc(var(--cell) * 128);
    width: var(--w);
    height: calc(var(--cell) * 95);
    background: var(--sprite) 0 0 / 1100% 100%;
    image-rendering: pixelated;
    animation: fly .8s steps(11) infinite;
    mask: var(--grid); mask-composite: intersect;
    filter: blur(.5px);
  }
  @keyframes fly {
    to {
      background-position: calc(var(--w) * -11) 0;
    }
  }
  @media (max-width: 540px) {
    .dragon { --cell: 2px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dragon { animation: none; }
  }

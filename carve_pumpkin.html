<!--
  Carve Pumpkin by @codinvisual · t.me/CodinVisual

  HOW TO USE
  Try it: double-click this file, it opens in your browser. Nothing to install, works offline.
  A real pumpkin sits on an old table with a face sketched on its skin in marker. Cut along the marks with your cursor
  or finger: the cut glows, the piece drops inside and candle light pours out of the hole. You can
  also cut freely, any closed loop becomes a hole. Finish the face and light escapes under the lid,
  a code shows up on the wall in that light. Copy code puts it on the clipboard, Start over brings
  a fresh pumpkin. Keyboard: Tab to the pumpkin, Enter cuts the next mark.

  Made for: a shop or a café on Halloween (carve the face, get a discount), a party page,
  a newsletter landing. People play for a minute and leave with a code they earned.

  Your own content, at the top of the <script>:
  CODE 'BOO15'                 the code written on the wall when the face is done
  DEAL '15% off tonight'       the line under it
  FACE                         the marks on the skin, each a list of points; 0,0 is the middle
                               of the pumpkin and 1 is its half-width, add or reshape them freely
  claimCode(code)              put a real request here if you want to count who got the code
  The photo is the <img class="cp-photo"> in the markup. To use your own picture, put it in src
  and set SPOT at the top of the script: where the pumpkin's middle is, its half-width and the
  line of the lid, as shares of the picture's width and height. A 4:5 picture fits the frame best.

  Worth changing at the top of the <script>:
  NEED 0.85          how much of a mark must be cut before the piece drops, 1 means all of it
  TOLERANCE 14       how close to the mark the cut must go, in px
  FLICKER 0.12       how much the candle flickers, 0 is a steady light
  FREE true          false lets people cut only along the marks
  Colours are the variables at the top of the main <style>: --wall, --ink, --light.

  Put it on your site:
  1. Copy the main <style> block. The small one above it is only for "body", leave it out.
  2. Copy the markup between "pumpkin start" and "pumpkin end".
  3. Copy the <script> and put it before </body>.

  With "reduce motion" turned on the candle does not flicker and the pieces fade instead of falling.
  Every class starts with "cp-", so the styles stay inside the block.

  КАК ПОЛЬЗОВАТЬСЯ
  Посмотреть: дважды щёлкните по файлу, он откроется в браузере. Ничего ставить не нужно, интернет не нужен.
  На старом столе настоящая тыква, на коже маркером намечено лицо. Режьте по разметке курсором или пальцем: надрез светится,
  кусок проваливается внутрь, и из дыры льётся свет свечи. Можно резать и свободно, любая замкнутая петля
  становится дыркой. Закончите лицо, и свет вырвется из-под крышки, а на стене в этом свете проступит код.
  Copy code копирует его, Start over даёт новую тыкву. С клавиатуры: Tab до тыквы, Enter вырезает следующую линию.

  Для чего: магазин или кафе на Хэллоуин (вырежи рожицу, получи скидку), страница вечеринки,
  страница рассылки. Человек играет минуту и уходит с кодом, который сам заработал.

  Свой контент, в начале <script>:
  CODE 'BOO15'                 код, который появляется на стене, когда лицо готово
  DEAL '15% off tonight'       строка под ним
  FACE                         линии на коже, каждая это список точек; 0,0 середина тыквы,
                               1 её полуширина, линии можно добавлять и менять
  claimCode(code)              сюда ставится настоящий запрос, если нужно считать, кто получил код
  Фото это <img class="cp-photo"> в разметке. Чтобы поставить свою картинку, замените src
  и задайте SPOT в начале скрипта: где середина тыквы, её полуширина и линия крышки,
  в долях ширины и высоты картинки. Лучше всего подходит картинка 4:5.

  Что стоит поменять в начале <script>:
  NEED 0.85          какую часть линии нужно прорезать, чтобы кусок выпал, 1 значит всю
  TOLERANCE 14       насколько близко к линии должен идти надрез, в px
  FLICKER 0.12       насколько мерцает свеча, 0 ровный свет
  FREE true          false разрешает резать только по разметке
  Цвета это переменные в начале основного <style>: --wall, --ink, --light.

  Как поставить на свой сайт:
  1. Скопируйте основной блок <style>. Маленький блок над ним нужен только для "body", его не берите.
  2. Скопируйте разметку между "pumpkin start" и "pumpkin end".
  3. Скопируйте <script> и поставьте его перед </body>.

  Если в системе включено «уменьшить движение», свеча не мерцает, а куски тают, а не падают.
  Все классы начинаются с "cp-", стили не выходят за пределы блока.

  .cp-btn.cp-quiet { box-shadow: inset 0 -1px 0 rgba(243, 233, 218, .3); color: var(--mute); font-weight: 500; }
  .cp-note { margin: 0; color: var(--mute); font-size: 15px; }
  .cp :focus-visible { outline: 2px solid var(--light); outline-offset: 3px; }
  @media (hover: hover) and (pointer: fine) {
    .cp-btn:hover { box-shadow: inset 0 -2px 0 var(--light), 0 16px 26px -20px rgba(255, 179, 71, .9); }

    return s + Math.hypot(nx - x, ny - y);
  }, 0);

  function roughen(pts, key, amp) {
    seed = 500 + key;
    const n = Math.max(40, Math.round(perimeter(pts) / (R * 0.025)));
    const ring = resample(pts, n);
    const jit = ring.map(() => rnd() - 0.5);
    return ring.map(([x, y], i) => {
      const [px, py] = ring[(i - 1 + n) % n], [nx, ny] = ring[(i + 1) % n];
      const dx = nx - px, dy = ny - py, l = Math.hypot(dx, dy) || 1;
      const j = (jit[(i - 1 + n) % n] + jit[i] * 2 + jit[(i + 1) % n]) / 4 * R * amp;
      return [x - dy / l * j, y + dx / l * j];
    });
  }

  function freshMarks() {
    marks = FACE.map((f, k) => ({ k, name: f.name, points: f.points, cut: false, hit: null, px: [], samples: [], rough: [], wob: [] }));
  }

  function layout() {
    const box = canvas.getBoundingClientRect();
    W = box.width;
    H = box.height;
    dpr = Math.min(window.devicePixelRatio || 1, 4);
    [canvas, base, holes, glow, wall].forEach(c => {
      c.width = Math.round(W * dpr);
      c.height = Math.round(H * dpr);
    });
    const iw = photo.naturalWidth || 4, ih = photo.naturalHeight || 5, k = Math.max(W / iw, H / ih);
    img = { x: (W - iw * k) / 2, y: (H - ih * k) / 2, w: iw * k, h: ih * k };
    cx = img.x + SPOT.x * img.w;
    cy = img.y + SPOT.y * img.h;
    R = SPOT.r * img.w;
    lidY = img.y + SPOT.lid * img.h;
    tol = Math.max(10, TOLERANCE * R / 180);
    marks.forEach(m => {
      m.px = m.points.map(toPx);
      const n = Math.max(40, Math.round(m.points.length * 14));
      const had = m.hit;
      m.samples = resample(m.px, n);
      m.hit = had && had.length === n ? had : new Array(n).fill(false);
      m.rough = roughen(m.px, m.k, 0.024);
      m.wob = roughen(m.px, m.k + 50, 0.008);
    });
    seed = 900;
    lid = [];
    for (let i = 0; i <= 40; i++) {
      const a = Math.PI * (0.02 + 0.96 * i / 40), j = 1 + (rnd() - 0.5) * 0.06;
      lid.push([cx + Math.cos(a) * R * 0.29 * j, lidY + Math.sin(a) * R * 0.085 * j]);
    }
    paintBase();
    paintHoles();
    paintWall();
  }

  function paintBase() {
    const c = base.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.fillStyle = '#0B0807';
    c.fillRect(0, 0, W, H);
    if (photo.complete && photo.naturalWidth) c.drawImage(photo, img.x, img.y, img.w, img.h);
    c.lineJoin = c.lineCap = 'round';
    c.strokeStyle = 'rgba(255, 220, 170, .18)';
    c.lineWidth = Math.max(1, R * 0.008);
    c.translate(0, 1);
    c.stroke(pathOf(lid, true));
    c.translate(0, -1);
    c.strokeStyle = 'rgba(30, 12, 4, .85)';
    c.lineWidth = Math.max(1.2, R * 0.01);
    c.stroke(pathOf(lid, true));
    marks.forEach(m => {
      if (m.cut) return;
      const p = pathOf(m.wob);
      c.strokeStyle = 'rgba(26, 12, 5, .24)';
      c.lineWidth = Math.max(2.4, R * 0.022);
      c.stroke(p);
      c.strokeStyle = 'rgba(26, 12, 5, .8)';
      c.lineWidth = Math.max(1.3, R * 0.011);
      c.stroke(p);
    });
  }

  function allHoles() {
    return marks.filter(m => m.cut).map(m => m.rough.length ? m.rough : m.px).concat(free);
  }

  function paintHoles() {
    const c = holes.getContext('2d'), g = glow.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    g.clearRect(0, 0, W, H);
    const T = R * 0.055;
    const inside = c.createRadialGradient(cx, cy + R * 0.24, 0, cx, cy + R * 0.1, R * 1.25);
    inside.addColorStop(0, '#FFF1C2');
    inside.addColorStop(0.3, '#FFD068');
    inside.addColorStop(0.6, '#FFA236');
    inside.addColorStop(0.85, '#EB7020');
    inside.addColorStop(1, '#A8401A');
    allHoles().forEach(pts => {
      const p = pathOf(pts);
      let y0 = 1e9, y1 = -1e9;
      pts.forEach(([, y]) => { y0 = Math.min(y0, y); y1 = Math.max(y1, y); });
      const flesh = c.createLinearGradient(0, y0, 0, y1);
      flesh.addColorStop(0, '#FFE3A0');
      flesh.addColorStop(0.6, '#F2B862');
      flesh.addColorStop(1, '#C98236');
      c.fillStyle = flesh;
      c.fill(p);
      c.save();
      c.clip(p);
      c.translate(0, -T);
      c.fillStyle = inside;
      c.fill(p);
      c.lineWidth = R * 0.035;
      c.strokeStyle = 'rgba(150, 60, 12, .3)';
      c.stroke(p);
      c.restore();
      c.lineWidth = Math.max(1, R * 0.01);
      c.strokeStyle = 'rgba(40, 14, 2, .75)';
      c.stroke(p);
      g.save();
      g.shadowColor = 'rgba(255, 140, 40, 1)';
      g.shadowBlur = R * 0.25 * dpr;
      g.fillStyle = 'rgba(255, 150, 50, 1)';
      g.fill(p);
      g.restore();
    });
  }

  function paintWall() {
    const c = wall.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    const wy = cy - R * 1.62, gy = wy + R * 0.1;
    const halo = c.createRadialGradient(cx, gy, 0, cx, gy, R * 1.35);
    halo.addColorStop(0, 'rgba(255, 186, 110, .34)');
    halo.addColorStop(0.5, 'rgba(255, 160, 80, .12)');
    halo.addColorStop(1, 'rgba(255, 160, 80, 0)');
    c.save();
    c.translate(cx, gy);
    c.scale(1, 0.62);
    c.translate(-cx, -gy);
    c.fillStyle = halo;
    c.fillRect(cx - R * 1.4, gy - R * 1.4, R * 2.8, R * 2.8);
    c.restore();
    const fan = c.createLinearGradient(0, lidY, 0, wy);
    fan.addColorStop(0, 'rgba(255, 190, 110, .2)');
    fan.addColorStop(1, 'rgba(255, 190, 110, 0)');
    c.filter = `blur(${Math.round(R * 0.09)}px)`;
    c.fillStyle = fan;
    c.beginPath();
    c.moveTo(cx - R * 0.24, lidY);
    c.lineTo(cx + R * 0.24, lidY);
    c.lineTo(cx + R * 0.95, wy);
    c.lineTo(cx - R * 0.95, wy);
    c.closePath();
    c.fill();
    c.filter = 'none';
    const size = R * 0.27;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.font = `700 ${size}px 'Avenir Next', 'Segoe UI', system-ui, sans-serif`;
    if ('letterSpacing' in c) c.letterSpacing = `${size * 0.1}px`;
    c.filter = `blur(${Math.max(1, Math.round(R * 0.014))}px)`;
    c.fillStyle = 'rgba(255, 200, 130, .7)';
    c.fillText(CODE, cx, wy);
    c.filter = 'none';
    c.shadowColor = 'rgba(255, 140, 50, .85)';
    c.shadowBlur = size * 0.45;
    c.fillStyle = 'rgba(255, 228, 182, .9)';
    c.fillText(CODE, cx, wy);
    c.shadowBlur = 0;
    c.font = `500 ${R * 0.09}px 'Avenir Next', 'Segoe UI', system-ui, sans-serif`;
    if ('letterSpacing' in c) c.letterSpacing = '0px';
    c.fillStyle = 'rgba(255, 226, 190, .8)';
    c.fillText(DEAL, cx, wy + size * 0.8);
  }

  function cutMark(m, t) {
    m.cut = true;
    const pts = m.rough && m.rough.length ? m.rough : m.px;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    pts.forEach(([x, y]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); });
    const sprite = layer();
    sprite.width = Math.ceil((x1 - x0 + 4) * dpr);
    sprite.height = Math.ceil((y1 - y0 + 4) * dpr);
    const s = sprite.getContext('2d');
    s.setTransform(dpr, 0, 0, dpr, -(x0 - 2) * dpr, -(y0 - 2) * dpr);
    s.clip(pathOf(pts));
    s.drawImage(base, 0, 0, W, H);
    pieces.push({ path: pathOf(pts), sprite, x: x0 - 2, y: y0 - 2, w: x1 - x0 + 4, h: y1 - y0 + 4, t0: t, mx: (x0 + x1) / 2, my: (y0 + y1) / 2 });
    flare = 1;
    paintBase();
    paintHoles();
    if (!done && marks.every(k => k.cut)) finish(t);
  }

  async function finish(t) {
    done = true;
    doneAt = t;
    copyBtn.hidden = false;
    againBtn.hidden = false;
    note.textContent = `The candle wrote ${CODE} on the wall.`;
    await claimCode(CODE);
  }

  function addFree(pts, t) {
    const simple = pts.filter((p, i) => i % 2 === 0);
    if (simple.length < 6) return;
    free.push(simple);
    const fake = { cut: false, px: simple };
    marks.push(fake);
    cutMark(fake, t);
    marks.pop();
  }

  const segDist = (px, py, ax, ay, bx, by) => {
    const vx = bx - ax, vy = by - ay, l = vx * vx + vy * vy || 1;
    const t = Math.max(0, Math.min(1, ((px - ax) * vx + (py - ay) * vy) / l));
    return Math.hypot(px - (ax + vx * t), py - (ay + vy * t));
  };
  const insideBody = (x, y) => ((x - cx) / (R * 1.05)) ** 2 + ((y - cy) / (R * 0.8)) ** 2 < 1;
  const local = e => {
    const b = canvas.getBoundingClientRect();
    return [e.clientX - b.left, e.clientY - b.top];
  };

  canvas.addEventListener('pointerdown', e => {
    const [x, y] = local(e);
    if (!insideBody(x, y)) return;
    canvas.setPointerCapture(e.pointerId);
    stroke = { pts: [[x, y]], len: 0, along: 0 };
  });
  canvas.addEventListener('pointermove', e => {
    if (!stroke) return;
    const [x, y] = local(e);
    const [ax, ay] = stroke.pts[stroke.pts.length - 1];
    const step = Math.hypot(x - ax, y - ay);
    if (step < 2) return;
    stroke.pts.push([x, y]);
    stroke.len += step;
    const now = performance.now();
    marks.forEach(m => {
      if (m.cut) return;
      let gained = 0;
      m.samples.forEach(([sx, sy], i) => {
        const near = segDist(sx, sy, ax, ay, x, y) < tol;
        if (!m.hit[i] && near) {
          m.hit[i] = true;
          gained++;
        }
      });
      stroke.along += gained;
      const cutSoFar = m.hit.filter(Boolean).length / m.hit.length;
      if (gained && cutSoFar >= NEED) cutMark(m, now);
    });
  });
  const release = () => {
    if (!stroke) return;
    const p = stroke.pts, [sx, sy] = p[0], [ex, ey] = p[p.length - 1];
    const closed = Math.hypot(ex - sx, ey - sy) < Math.max(22, R * 0.12) && stroke.len > R * 0.6 && stroke.along < p.length * 0.3;
    if (FREE && closed && p.every(([x, y]) => insideBody(x, y))) addFree(p, performance.now());
    else fading.push({ pts: p, t0: performance.now() });
    stroke = null;
  };
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    const next = marks.find(m => !m.cut);
    if (next) cutMark(next, performance.now());
  });

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(CODE);
      note.textContent = `${CODE} is on your clipboard.`;
    } catch (e) {
      note.textContent = `Your code: ${CODE}`;
    }
  });
  againBtn.addEventListener('click', () => {
    freshMarks();
    free = [];
    pieces = [];
    fading = [];
    done = false;
    copyBtn.hidden = true;
    againBtn.hidden = true;
    note.textContent = '';
    layout();
  });

  function slit(points, alpha) {
    if (points.length < 2) return;
    ctx.save();
    ctx.lineCap = ctx.lineJoin = 'round';
    ctx.shadowColor = `rgba(255, 150, 50, ${alpha})`;
    ctx.shadowBlur = 8;
    ctx.strokeStyle = `rgba(255, 196, 110, ${alpha})`;
    ctx.lineWidth = Math.max(1.6, R * 0.014);
    ctx.beginPath();
    points.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.stroke();
    ctx.restore();
  }
  function traced(m) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(255, 150, 50, .9)';
    ctx.shadowBlur = 8;
    ctx.strokeStyle = '#FFC46E';
    ctx.lineWidth = Math.max(1.8, R * 0.016);
    ctx.beginPath();
    const n = m.samples.length;
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      if (m.hit[i] && m.hit[j]) {
        ctx.moveTo(m.samples[i][0], m.samples[i][1]);
        ctx.lineTo(m.samples[j][0], m.samples[j][1]);
      }
    }
    ctx.stroke();
    ctx.restore();
  }

  function frame(t) {
    const calm = still.matches;
    const s = t / 1000;
    const f = calm ? 0 : 0.5 * Math.sin(9.1 * s) + 0.3 * Math.sin(17.3 * s + 1.1) + 0.2 * Math.sin(41.7 * s + 2.4);
    flare = Math.max(0, flare - 0.03);
    const light = 1 + FLICKER * f + flare * 0.5;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(base, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (done) {
      const k = calm ? 1 : Math.min(1, (t - doneAt) / 900);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = k * Math.min(1, 0.85 + FLICKER * f);
      ctx.drawImage(wall, 0, 0, W, H);
      ctx.restore();
      ctx.save();
      ctx.strokeStyle = `rgba(255, 214, 140, ${0.85 * k})`;
      ctx.shadowColor = 'rgba(255, 150, 50, 1)';
      ctx.shadowBlur = 12;
      ctx.lineWidth = Math.max(1.5, R * 0.012);
      ctx.stroke(pathOf(lid, true));
      ctx.restore();
    }

    const count = allHoles().length;
    if (count) {
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(cx, cy - R * 0.02, R * 1.04, R * 0.84, 0, 0, Math.PI * 2);
      ctx.clip();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = Math.max(0, Math.min(1, 0.4 * light));
      ctx.drawImage(glow, 0, 0, W, H);
      ctx.restore();
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const spill = ctx.createRadialGradient(cx, cy + R * 0.86, 0, cx, cy + R * 0.86, R * 1.1);
      spill.addColorStop(0, `rgba(255, 150, 60, ${Math.min(1, count / FACE.length) * 0.3 * Math.min(1.2, light)})`);
      spill.addColorStop(1, 'rgba(255, 150, 60, 0)');
      ctx.translate(cx, cy + R * 0.86);
      ctx.scale(1, 0.22);
      ctx.translate(-cx, -(cy + R * 0.86));
      ctx.fillStyle = spill;
      ctx.fillRect(cx - R * 1.2, cy - R * 0.4, R * 2.4, R * 2.6);
      ctx.restore();
      ctx.drawImage(holes, 0, 0, W, H);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = Math.max(0, Math.min(1, 0.22 * (light - 0.8)));
      ctx.drawImage(holes, 0, 0, W, H);
      ctx.restore();
    }

    pieces = pieces.filter(p => {
      const e = Math.min(1, (t - p.t0) / (calm ? 300 : 700));
      if (e >= 1) return false;
      ctx.save();
      ctx.clip(p.path);
      if (calm) {
        ctx.globalAlpha = 1 - e;
        ctx.drawImage(p.sprite, p.x, p.y, p.w, p.h);
      } else {
        const g = e * e;
        ctx.translate(p.mx + (cx - p.mx) * 0.25 * g, p.my + R * 0.12 * g);
        ctx.rotate((p.mx < cx ? -1 : 1) * 0.35 * g);
        ctx.scale(1 - 0.45 * g, 1 - 0.45 * g);
        ctx.translate(-p.mx, -p.my);
        ctx.globalAlpha = 1 - g * 0.6;
        ctx.drawImage(p.sprite, p.x, p.y, p.w, p.h);
        ctx.globalAlpha = g * 0.7;
        ctx.fillStyle = '#1A0702';
        ctx.fill(p.path);
      }
      ctx.restore();
      return true;
    });

    marks.forEach(m => { if (!m.cut && m.hit && m.hit.some(Boolean)) traced(m); });
    if (stroke) slit(stroke.pts, 0.9);
    fading = fading.filter(fd => {
      const a = 1 - (t - fd.t0) / 600;
      if (a <= 0) return false;
      slit(fd.pts, a * 0.7);
      return true;
    });
    requestAnimationFrame(frame);
  }

  freshMarks();
  layout();
  if (!photo.complete) photo.addEventListener('load', layout);
  new ResizeObserver(() => layout()).observe(canvas);
  if (document.fonts) document.fonts.ready.then(() => paintWall());
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
